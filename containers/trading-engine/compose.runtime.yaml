# Explicit operational override; does not create an approval or enable trading.
# docker compose -f compose.yaml -f compose.runtime.yaml up -d
services:
  trading-engine:
    command: ["--approval-file", "/app/approvals/runtime.json", "serve"]
    restart: "on-failure:3"
    environment:
      CODEX_HOME: /app/auth
    networks:
      - isolated
      - gateway
    volumes:
      - ${DANTA_APPROVAL_DIR:?Set the root-owned read-only approval directory}:/app/approvals:ro
      # Codex refreshes its own login credentials; this dedicated directory is writable.
      - ${DANTA_AUTH_DIR:-codex-auth}:/app/auth:rw

volumes:
  codex-auth:
    name: ${DANTA_AUTH_VOLUME:-trading-engine-auth}

# Only the runtime joins the operator-created gateway/egress network.
networks:
  gateway:
    name: ${DANTA_GATEWAY_NETWORK:-danta-catalyst-net}
    external: true
