services:
  init:
    image: dokysp/trading-engine:latest
    user: "0:0"
    entrypoint: ["python", "-m", "danta.container_init"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./config:/app/config:rw
      - ./var:/app/var:rw
      - ./locks:/tmp/danta-writers-10001:rw
      - codex-auth:/app/auth:rw

  trading-engine:
    image: dokysp/trading-engine:latest
    user: "10001:10001"
    command: ["serve"]
    restart: "on-failure:3"
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      CODEX_HOME: /app/auth
    read_only: true
    init: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    volumes:
      - ./config:/app/config:ro
      - ./var:/app/var:rw
      - ./locks:/tmp/danta-writers-10001:rw
      - codex-auth:/app/auth:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777

volumes:
  codex-auth:
    name: trading-engine-auth

networks:
  default:
    name: danta-catalyst-net
    external: true
