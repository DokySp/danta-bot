services:
  trading-engine:
    container_name: trading-engine
    image: dokysp/trading-engine:latest
    entrypoint: ["python", "-m", "danta.container_init"]
    # The entrypoint prepares permissions, then drops to UID/GID 10001.
    user: "0:0"
    command: ["serve"]
    restart: "on-failure:3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      CODEX_HOME: /app/auth
    read_only: true
    init: true
    cap_drop: ["ALL"]
    # KILL lets root tini forward stop signals after the engine drops its UID.
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID", "KILL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    volumes:
      - ./config:/app/config:ro
      # Root-only bootstrap access; /root is mode 0700 and inaccessible to the engine.
      - ./config:/root/danta-config:rw
      - ./var:/app/var:rw
      - ./locks:/tmp/danta-writers-10001:rw
      - codex-auth:/app/auth:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777

volumes:
  codex-auth:
    name: trading-engine-auth

networks:
  default:
    name: danta-bot-net
