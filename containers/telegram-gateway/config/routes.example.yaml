routes:
  # Remaining commands stay available through /status buttons and legacy aliases.
  trading-engine:
    env_file: /app/config/telegram.env
    url: http://trading-engine:8080/telegram
    bot_commands:
      - command: status
        description: 인증·계좌·보호 감시 상태와 운영 메뉴
        instruction: /status
      - command: report
        description: 오늘의 거래·판단 HTML 리포트
        instruction: /report
      - command: usage
        description: Codex 남은 한도와 초기화 시각
        instruction: /usage
      - command: new
        description: 새 대화 시작(거래 상태 유지)
        instruction: /new
      - command: stop
        description: 진행 중인 대화 응답 취소
        instruction: /stop
