services:
  telegram-gateway:
    container_name: telegram-gateway
    image: dokysp/telegram-gateway:latest
    user: "0:0"
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./config:/app/config:ro
      - ./memory:/workspace/memory:rw
    restart: unless-stopped

networks:
  default:
    name: danta-bot-net
