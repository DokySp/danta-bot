services:
  telegram-gateway:
    container_name: telegram-gateway
    image: ${GATEWAY_IMAGE:-dokysp/telegram-gateway:latest}
    user: "0:0"
    environment:
      GATEWAY_ROUTES_FILE: /app/config/routes.yaml
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8080
      HTTP_TIMEOUT: 10
      LOG_LEVEL: INFO
      GATEWAY_CONVERSATION_LOG_DIR: /workspace/memory/telegram-conversations
      DANTA_TELEGRAM_PEER_SECRET_FILE: /app/config/codex-peer.secret
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./config:/app/config:ro
      - ./memory:/workspace/memory:rw
    restart: unless-stopped
    networks:
      default:
        ipv4_address: ${DANTA_GATEWAY_IP:?Set the fixed gateway address from deployment .env}

networks:
  default:
    name: ${DANTA_GATEWAY_NETWORK:-danta-catalyst-net}
    external: true
