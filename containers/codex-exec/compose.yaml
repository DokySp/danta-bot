services:
  codex-exec:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DANTA_IMAGE:-danta-codex-exec:local}
    user: "10001:10001"
    command: ["doctor"]
    restart: "no"
    read_only: true
    init: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    # Configuration, secrets, approvals, database and host-wide writer lock are external.
    volumes:
      - ${DANTA_CONFIG_DIR:?Set an external config directory}:/app/config:ro
      - ${DANTA_STATE_DIR:?Set a local state directory}:/app/var:rw
      - ${DANTA_LOCK_DIR:?Set the shared private writer-lock directory}:/tmp/danta-writers-10001:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    # No host port, Docker socket, host network, or automatic live command.
    networks:
      - isolated

networks:
  isolated:
    internal: true
