schedules:
  - id: market-news
    enabled: true
    cron: "*/15 * * * *"
    market_news: {}

  - id: collect-financial-information
    enabled: true
    cron: "0 6 * * 1-5"
    model: gpt-5.6-luna
    model_reasoning_effort: low
    message: |
      $check-portfolio로 recommended, specified, holding, universe JSON을 확인하고, check-portfolio의 universe 전체 종목을 대상으로
      $collect-financial-information 수행하고 그 결과를 출력해줘.

  - id: trading-toggle
    enabled: true
    cron: "0 8 * * 1-5"
    model: gpt-5.6-luna
    model_reasoning_effort: low
    message: |
      $check-holiday 스킬을 통해서 휴장일인지 확인하고, $trading-schedule-toggle 을 통해 휴장일이 아닌 경우 daily 스케줄을 활성화, 휴장일인 경우 daily 스케줄을 비활성화해줘.

  - id: daily-00
    enabled: true
    cron: "0 7 * * 1-5"
    daily_trading:
      env: acct
      request_type: real-submit
      submit_orders: true
      order_path: reservation
      review_extra_instructions:
        analyst_review:
          - "예약 거래에서는 장중 가격·호가·수급 정보는 이미 관측된 정적 근거로 보고 과도하게 추격 반영하지 않는다."
          - "회사 재무 정보, 신규 뉴스·공시·이벤트성 재료와 다음 장 갭 리스크의 비중을 상대적으로 높여 판단한다."
        judge_review:
          - "예약 거래에서는 다음 장 갭 리스크를 목표수량 판단에 명시적으로 반영한다."
    # 이전 Main Codex message:
    # $check-portfolio로 recommended, specified, holding, universe JSON을 확인하고, check-portfolio의 universe를 $daily-trading 대상으로 사용해줘.
    # $daily-trading 스킬로 실전(acct) 거래를 지정가 예약 거래로 진행하고 거래 내역, 계좌 상태, 수익 상태를 요약해서 알려줘.
    # 예약 거래로 진행하는 경우, 장중 가격·호가·수급 정보는 이미 관측된 정적 근거로 보고 과도하게 추격 반영하지 마.
    # 예약 거래 판단에서는 회사 재무 정보, 신규 뉴스·공시·이벤트성 재료와 다음 장 갭 리스크의 비중을 상대적으로 높여 목표수량을 판단해.
    # 단, financial-information 혹은 news-information가 없다는 이유만으로 점수·확신도·목표수량을 낮추거나 주문을 차단하지 마.

  - id: daily-10
    enabled: true
    cron: "5,20,40 9 * * 1-5"
    daily_trading:
      env: acct
      request_type: real-submit
      submit_orders: true
      order_path: immediate
    # 이전 Main Codex message:
    # $check-portfolio로 recommended, specified, holding, universe JSON을 확인하고, check-portfolio의 universe를 $daily-trading 대상으로 사용해줘.
    # 예약 거래 내역을 확인하고 $daily-trading 스킬로 실전(acct) 거래를 진행하고 거래 내역, 계좌 상태, 수익 상태를 요약해서 알려줘.

  - id: daily-20
    enabled: true
    cron: "0,30 10,11 * * 1-5"
    daily_trading:
      env: acct
      request_type: real-submit
      submit_orders: true
      order_path: immediate
