thresholds:
  profit:
    min_pnl_rate_pct: 5                  # used by: profit_take_candidate
    high_concentration_pct: 10           # used by: profit_take_candidate
    range_position_overextended_pct: 75  # used by: profit_take_candidate
    day_change_overextended_pct: 3       # used by: profit_take_candidate
    five_day_change_overextended_pct: 8  # used by: profit_take_candidate
    ma20_distance_overextended_pct: 8    # used by: profit_take_candidate

  downside:
    day_change_pct: -3                   # used by: risk_reduce_candidate
    intraday_change_pct: -3              # used by: risk_reduce_candidate
    five_day_change_pct: -5              # used by: risk_reduce_candidate
    ma20_distance_pct: -3                # used by: risk_reduce_candidate
    reduce_concentration_pct: 8          # used by: risk_reduce_candidate

  damage:
    ma20_distance_pct: -5                # used by: missed_reduce_observe, risk_reduce_candidate, bottom_watch, staged_rebuy_candidate
    five_day_change_pct: -8              # used by: missed_reduce_observe, risk_reduce_candidate, bottom_watch, staged_rebuy_candidate

  bottom:
    near_low_range_position_pct: 20      # used by: missed_reduce_observe, bottom_watch, staged_rebuy_candidate
    damaged_range_position_pct: 35       # used by: bottom_watch, staged_rebuy_candidate

  panic:
    day_change_pct: -8                   # used by: missed_reduce_observe
    intraday_change_pct: -7              # used by: missed_reduce_observe

  rebound:
    day_change_pct_gt: 0                 # used by: staged_rebuy_candidate
    intraday_change_pct_gte: 1           # used by: staged_rebuy_candidate
    max_rebuy_concentration_pct: 12      # used by: staged_rebuy_candidate
