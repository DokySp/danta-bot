schema_version: "1"
provider: gdelt_doc_2
initial_lookback_hours: 72
max_lookback_hours: 72
overlap_minutes: 30
lock_timeout_seconds: 3600
rate_limit_cooldown_seconds: 1800
min_request_window_minutes: 15
max_requests_per_source: 16
context_max_items: 30
request:
  base_url: "https://api.gdeltproject.org/api/v2/doc/doc"
  timeout_seconds: 20
  retries: 3
  retry_backoff_seconds: [1, 3, 8]
  max_records: 250
sources:
  - id: domestic
    label: "South Korea domestic market coverage"
    query: "sourcecountry:southkorea (business OR economy OR stock OR market OR finance OR trade OR currency OR policy OR regulation OR industry OR technology OR energy OR politics)"
  - id: global
    label: "Global market/macro/geopolitical coverage"
    query: "-sourcecountry:southkorea (business OR economy OR stock OR market OR finance OR macroeconomic OR geopolitical OR sanctions OR war OR conflict OR tariff OR election OR diplomacy OR centralbank OR currency OR oil OR energy OR shipping)"
